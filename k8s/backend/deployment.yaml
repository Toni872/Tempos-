apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempos-backend
  namespace: tempos
  labels:
    app: tempos-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempos-backend
  template:
    metadata:
      labels:
        app: tempos-backend
    spec:
      containers:
      - name: backend
        # Reemplazar con la URL real de la imagen en Artifact Registry / GCR
        image: gcr.io/tempos-project/tempos-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: tempos-config
        - secretRef:
            name: tempos-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
