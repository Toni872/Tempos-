apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempos-worker
  namespace: tempos
  labels:
    app: tempos-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempos-worker
  template:
    metadata:
      labels:
        app: tempos-worker
    spec:
      containers:
      - name: worker
        # Reemplazar con la URL real de la imagen en Artifact Registry / GCR
        image: gcr.io/tempos-project/tempos-worker:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: tempos-config
        - secretRef:
            name: tempos-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        # Opcional: Probes para el worker si expone un endpoint /health
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
